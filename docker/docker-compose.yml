version: "3.9"

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"     # S3 API
      - "9090:9090"     # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 2s
      retries: 15

  # Week 1: ingestion container (runs your Python script)
  ingestion:
    build:
      context: ../ingestion
      dockerfile: Dockerfile
    environment:
      POLYGON_API_KEY: ${POLYGON_API_KEY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    # Bind mount so you can edit code and rerun without rebuilds
    volumes:
      - ../ingestion:/app
    command: >
      sh -c "python -m ingestion.run_once"
    profiles: ["ingest"]   # optional; run with --profile ingest

  # Optional: TimescaleDB (enable when needed)
  timescale:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    profiles: ["db"]

  # Optional: ClickHouse (enable when needed)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"   # HTTP
      - "9001:9000"   # Native (remap to avoid clash with MinIO)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    profiles: ["db"]

  # Optional: FastAPI backend (enable when needed)
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      - minio
    profiles: ["api"]

volumes:
  minio-data:
  timescale-data:
  clickhouse-data:
